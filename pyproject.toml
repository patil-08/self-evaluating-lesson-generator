[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-lesson-generator"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph==0.2.74",
    "openai==1.59.8",
    "python-dotenv==1.0.1",
    "PyYAML==6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["lessongen*"]
